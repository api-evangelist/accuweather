openapi: 3.2.0
info:
  title: AccuWeather One Test API
  description: AccuWeather's internal product API for the One platform.
  version: v1
tags:
- name: Test
paths:
  /api/test/linked-scope:
    get:
      tags:
      - Test
      summary: AccuWeather Example of a Simple Scope and Linked Scope
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentLocation'
              examples:
                _api_test_linked-scope200Example:
                  summary: Default _api_test_linked-scope 200 response
                  x-microcks-default: true
                  value:
                    id: '500123'
                    key: '347628'
                    name: New York
                    longName: New York
                    displayName: New York
                    localTime: example-value
                    displayTemperature: example-value
                    icon: 6
                    color: example-value
                    isBefore7PM: true
                    isDayTime: true
                    latitude: 40.7128
                    longitude: -74.006
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      operationId: getApiTestLinkedScope
      x-operation-id-source: derived
components:
