          - string
          - 'null'
        key:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        longName:
          type:
          - string
          - 'null'
        displayName:
          type:
          - string
          - 'null'
        localTime:
          type:
          - string
          - 'null'
        displayTemperature:
          type:
          - string
          - 'null'
        icon:
          type:
          - integer
          - 'null'
          format: int32
        color:
          type:
          - string
          - 'null'
        isBefore7PM:
          type: boolean
        isDayTime:
          type: boolean
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
      additionalProperties: false
