description: AccuWeather provides the world's most sophisticated weather intelligence
  to make lives simpler, safer, and better. Their mission is to save lives and protect
  property through accurate weather forecasting and data. The AccuWeather One Platform
  API delivers current conditions, forecasts (hourly, daily, minutecast), air quality,
  storm tracking, lifestyle indices, and imagery to tens of billions of API calls
  daily.
